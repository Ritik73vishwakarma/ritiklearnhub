{% extends 'base.html' %}
{% block content %}

</head>


<body>


    <!-- Password Card -->

    <div class="password-card">


        <!-- Icon -->

        <div class="password-icon">
            🔐
        </div>


        <h2>Reset Password</h2>

        <p class="subtitle">
            Enter your current password and create a new
            secure password for your account.
        </p>


        <form id="passwordForm" methoD="POST" action="{{url_for('passe')}}">


            <!-- Old Password -->

            <div class="input-group">

                <label for="oldPassword">
                    Inter username
                </label>
                <div class="input-wrapper">

                    <input
                        type="password"
                        id="name"
                        name="username"
                        placeholder="Enter your name"
                        required
                    >

                <div class="input-wrapper">
                    <label for="oldPassword">
                    Enter old password
                </label>

                    <input
                        type="password"
                        id="oldPassword"
                        name="old_password"
                        placeholder="Enter current password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="oldPassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- New Password -->

            <div class="input-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        name="new_password"
                        placeholder="Create new password"
                        required
                    >
                </div>

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="confirmPassword"
                    >
                        👁
                    </button>

                </div>

                <span
                    class="match-text"
                    id="matchText"
                ></span>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="reset-btn"
                id="resetBtn"
            >
                Reset Password
            </button>

        </form>


        <!-- Back -->

        <a
            href="/login"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>
    {%endblock%}
